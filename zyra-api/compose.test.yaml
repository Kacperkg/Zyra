name: zyra-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zyra_test
      POSTGRES_USER: zyra_test
      POSTGRES_PASSWORD: zyra_test_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyra_test -d zyra_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
